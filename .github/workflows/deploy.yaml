name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t pavansimha/agrishield-django:latest .

    - name: Push Docker Image
      run: docker push pavansimha/agrishield-django:latest

    - name: Deploy to EC2 (Kubernetes)
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          # 1. Point to the NEW Kubernetes keys (not k3s)
          export KUBECONFIG=/home/ubuntu/.kube/config
          
          echo "Checking Kubernetes..."
          kubectl get nodes

          # 2. Go to your project folder
          cd ~/agrishield-django

          echo "Applying deployment..."
          # This ensures Kubernetes has the latest instructions
          kubectl apply -f deployment.yaml

          echo "Restarting deployment..."
          # This forces the Pods to pull the NEW image from Docker Hub
          kubectl rollout restart deployment django-deployment

          echo "Deployment triggered successfully ✅"