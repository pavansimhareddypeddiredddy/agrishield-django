{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgriShield | AI Protection{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary-green: #2ecc71;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5; /* Light grey background makes the white cards "pop" */
            overflow-x: hidden;
        }

        /* 3D NAV BAR EFFECT */
        .navbar {
            background: var(--glass) !important;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary-green);
            transition: all 0.3s ease;
            perspective: 1000px; /* Prepares for 3D moves */
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -1px;
            transition: transform 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.1) rotate(-2deg); /* Tiny 3D tilt */
        }

        /* PREMIUM BUTTONS */
        .btn-scan {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            border: none;
            border-radius: 50px;
            color: white !important;
            font-weight: 600;
            padding: 10px 25px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-scan:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.6);
        }

        /* CONTENT ANIMATION */
        .main-wrapper {
            animation: fadeInUp; /* From Animate.css */
            animation-duration: 1s;
        }

        /* 3D FLOATING FOOTER */
        footer {
            background: #1a1a1a;
            color: white;
            border-top: 5px solid var(--primary-green);
            padding: 40px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-success animate__animated animate__fadeInLeft" href="{% url 'home' %}">
                <i class="fas fa-leaf me-2"></i>Agri<span class="text-dark">Shield</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link fw-bold px-3" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold px-3" href="{% url 'crops' %}">Crops</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold px-3" href="{% url 'diseases' %}">Diseases</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-scan ms-lg-3 animate__animated animate__pulse animate__infinite" href="{% url 'upload' %}">
                            <i class="fas fa-camera me-2"></i>Detect Now
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 main-wrapper">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center">
        <div class="container">
            <h5 class="fw-bold mb-3">AgriShield AI</h5>
            <p class="text-muted">Empowering Indian Farmers with Deep Learning Technology.</p>
            <div class="social-icons mb-3">
                <i class="fab fa-github mx-2"></i>
                <i class="fab fa-aws mx-2"></i>
                <i class="fab fa-docker mx-2"></i>
            </div>
            <p class="small mb-0 opacity-50">&copy; 2026 Final Year B.Tech Project - Group 5</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
