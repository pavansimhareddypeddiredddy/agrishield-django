<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup | AgriShield</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(rgba(0,80,40,0.7), rgba(0,120,60,0.7)),
    url('https://images.unsplash.com/photo-1500382017468-9049fed747ef');
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* CARD */
.form-container {
    width: 800px;
    background: rgba(0,0,0,0.55);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

/* TITLE */
.form-container h2 {
    text-align: center;
    color: white;
    margin-bottom: 25px;
}

/* GRID */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.full {
    grid-column: span 2;
}

/* INPUT GROUP */
.input-group {
    position: relative;
}

.input-group input,
.input-group select {
    width: 100%;
    height: 50px;
    padding: 14px 14px 14px 42px;
    border-radius: 12px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.95);
    font-size: 14px;
    box-sizing: border-box;
}

/* ICON */
.input-group i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #2ecc71;
}

/* LABEL */
.input-group label {
    position: absolute;
    left: 42px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: #666;
    transition: 0.25s;
    pointer-events: none;
}

/* FLOAT */
.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label,
.input-group select:focus + label,
.input-group select:valid + label {
    top: -8px;
    left: 35px;
    font-size: 11px;
    background: rgba(0,0,0,0.7);
    color: #00ff99;
    padding: 2px 6px;
    border-radius: 6px;
}

/* BUTTON */
.btn {
    grid-column: span 2;
    height: 50px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(90deg,#00c853,#64dd17);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* ERROR */
.error-box {
    background: #ff4d4d;
    color: white;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="form-container">
    <h2>🌱 Create Farmer Account</h2>

    {% if form.errors %}
    <div class="error-box">
        {{ form.errors }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="input-group full">
                <input type="text" name="username" placeholder=" " required>
                <label>Username</label>
                <i class="fa fa-user"></i>
            </div>

            <div class="input-group full">
                <input type="email" name="email" placeholder=" " required>
                <label>Email</label>
                <i class="fa fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password1" placeholder=" " required>
                <label>Password</label>
                <i class="fa fa-lock"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password2" placeholder=" " required>
                <label>Confirm Password</label>
                <i class="fa fa-lock"></i>
            </div>

            <div class="input-group">
                <input type="text" name="first_name" placeholder=" " required>
                <label>First Name</label>
                <i class="fa fa-user"></i>
            </div>

            <div class="input-group">
                <input type="text" name="last_name" placeholder=" " required>
                <label>Last Name</label>
                <i class="fa fa-user"></i>
            </div>

            <div class="input-group">
                <input type="number" name="age" placeholder=" " required>
                <label>Age</label>
                <i class="fa fa-calendar"></i>
            </div>

            <div class="input-group">
                <select name="gender" required>
                    <option value="" disabled selected hidden></option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
                <label>Gender</label>
                <i class="fa fa-venus-mars"></i>
            </div>

            <div class="input-group">
                <select name="state" required>
                    <option value="" disabled selected hidden></option>
                    <option>Andhra Pradesh</option>
                    <option>Arunachal Pradesh</option>
                    <option>Assam</option>
                    <option>Bihar</option>
                    <option>Chhattisgarh</option>
                    <option>Goa</option>
                    <option>Gujarat</option>
                    <option>Haryana</option>
                    <option>Himachal Pradesh</option>
                    <option>Jharkhand</option>
                    <option>Karnataka</option>
                    <option>Kerala</option>
                    <option>Madhya Pradesh</option>
                    <option>Maharashtra</option>
                    <option>Manipur</option>
                    <option>Meghalaya</option>
                    <option>Mizoram</option>
                    <option>Nagaland</option>
                    <option>Odisha</option>
                    <option>Punjab</option>
                    <option>Rajasthan</option>
                    <option>Sikkim</option>
                    <option>Tamil Nadu</option>
                    <option>Telangana</option>
                    <option>Tripura</option>
                    <option>Uttar Pradesh</option>
                    <option>Uttarakhand</option>
                    <option>West Bengal</option>
                </select>
                <label>State</label>
                <i class="fa fa-map"></i>
            </div>

            <div class="input-group">
                <input type="text" name="district" placeholder=" " required>
                <label>District</label>
                <i class="fa fa-location-dot"></i>
            </div>

            <button type="submit" class="btn">Signup</button>
            <!-- ADD THIS BELOW SIGNUP BUTTON -->
<div style="grid-column: span 2; text-align: center; margin-top: 10px;">
    <span style="color: white; font-size: 13px;">Already have an account?</span><br>
    
    <a href="{% url 'login' %}" 
       style="
        display: inline-block;
        margin-top: 8px;
        padding: 10px 25px;
        border-radius: 20px;
        background: transparent;
        border: 2px solid #00ff99;
        color: #00ff99;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
       "
       onmouseover="this.style.background='#00ff99'; this.style.color='black';"
       onmouseout="this.style.background='transparent'; this.style.color='#00ff99';">
       Login
    </a>
</div>

        </div>
    </form>

</div>

</body>
</html>
