<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | AgriShield</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        background: url("https://images.unsplash.com/photo-1500382017468-9049fed747ef") no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 🌿 Overlay */
    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            rgba(0, 80, 40, 0.4),
            rgba(0, 120, 60, 0.3)
        );
        backdrop-filter: blur(3px);
    }

    /* 🌟 FORM */
    .form-container {
        position: relative;
        width: 420px;
        padding: 40px;
        border-radius: 25px;

        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);

        color: #fff;

        animation: fadeIn 1s ease-in-out;
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 30px;
        font-weight: 700;
    }

    /* 🔥 FLOATING INPUT */
    .input-group {
        position: relative;
        margin-bottom: 22px;
    }

    .input-group input {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        outline: none;

        background: rgba(255, 255, 255, 0.9);
        font-size: 15px;
    }

    .input-group label {
        position: absolute;
        top: 50%;
        left: 14px;
        transform: translateY(-50%);
        color: #555;
        font-size: 14px;
        pointer-events: none;
        transition: 0.3s;
    }

    /* ✨ FLOAT EFFECT */
    .input-group input:focus + label,
    .input-group input:valid + label {
        top: -8px;
        left: 10px;
        font-size: 12px;
        color: #00ff99;
        background: #000;
        padding: 2px 6px;
        border-radius: 5px;
    }

    /* 🔥 BUTTON */
    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;

        background: linear-gradient(45deg, #00c853, #76ff03);
        color: #fff;

        transition: 0.3s;
    }

    .btn:hover {
        transform: scale(1.07);
        box-shadow: 0 0 20px #00ff99;
    }

    .signup-link {
        text-align: center;
        margin-top: 15px;
    }

    .signup-link a {
        color: #aaffc3;
        font-weight: 700;
        text-decoration: none;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    .error {
        text-align: center;
        color: red;
        margin-bottom: 10px;
        font-weight: 600;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

</style>
</head>

<body>

<div class="overlay"></div>

<div class="form-container">
    <h2>🌿 Farmer Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <!-- Username -->
        <div class="input-group">
            <input type="text" name="username" required>
            <label>Username</label>
        </div>

        <!-- Password -->
        <div class="input-group">
            <input type="password" name="password" required>
            <label>Password</label>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="signup-link">
        Don’t have an account? <a href="{% url 'signup' %}">Signup</a>
    </div>
</div>

</body>
</html>
